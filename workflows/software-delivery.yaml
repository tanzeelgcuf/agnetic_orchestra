# Default software-delivery workflow.
#
# Phase 2 wires the requirements stage to the real Requirements Agent (Jira +
# LLM reasoning, heuristic fallback) behind a requirements approval gate.
# Phase 4 wires the development stage to the Development Agent (headless
# Claude Code; noop in tests/unconfigured environments). Reviews remain noop:
# review fan-out lands in Phase 5, the quality gate in Phase 6, deployment in
# Phase 7.

name: software-delivery
description: Requirements -> approval -> development -> parallel review -> gate -> approval -> merge -> deploy -> verify

stages:
  - id: requirements
    agent: requirements-agent

  - id: requirements-approval
    type: approval
    depends_on: [requirements]

  - id: development
    agent: development-agent
    max_attempts: 2
    timeout_ms: 3600000
    depends_on: [requirements-approval]

  - id: reviews
    type: parallel
    parallel:
      - noop-review-agent
      - noop-security-agent
    depends_on: [development]

  - id: quality-gate
    agent: noop-agent
    depends_on: [reviews]

  - id: human-approval
    type: approval
    depends_on: [quality-gate]

  - id: merge
    agent: noop-agent
    depends_on: [human-approval]

  - id: deployment
    agent: noop-agent
    depends_on: [merge]

  - id: verification
    agent: noop-agent
    depends_on: [deployment]
