# Default software-delivery workflow.
#
# Phase 2 wires the requirements stage to the real Requirements Agent (Jira +
# LLM reasoning, heuristic fallback) behind a requirements approval gate.
# Phase 4 wires development to the Development Agent (headless Claude Code;
# noop in tests/unconfigured environments). Phase 5 wires the reviews stage to
# four real review agents. Phase 6 wires the quality gate to the deterministic
# Quality Gate Agent with a rework edge back to development (§49, bounded by
# max_rework). Deployment remains noop until Phase 7.

name: software-delivery
description: Requirements -> approval -> development -> parallel review -> gate (rework loop) -> approval -> merge -> deploy -> verify

stages:
  - id: requirements
    agent: requirements-agent

  - id: requirements-approval
    type: approval
    depends_on: [requirements]

  - id: development
    agent: development-agent
    max_attempts: 2
    timeout_ms: 3600000
    depends_on: [requirements-approval]

  - id: reviews
    type: parallel
    parallel:
      - code-review-agent
      - security-review-agent
      - architecture-review-agent
      - test-review-agent
    depends_on: [development]

  - id: quality-gate
    agent: quality-gate-agent
    rework_to: development
    max_rework: 2
    depends_on: [reviews]

  - id: human-approval
    type: approval
    depends_on: [quality-gate]

  - id: merge
    agent: noop-agent
    depends_on: [human-approval]

  - id: deployment
    agent: noop-agent
    depends_on: [merge]

  - id: verification
    agent: noop-agent
    depends_on: [deployment]
