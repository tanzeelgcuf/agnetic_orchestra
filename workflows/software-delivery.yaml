# Default software-delivery workflow.
#
# Phase 2 wires the requirements stage to the real Requirements Agent (Jira +
# LLM reasoning, heuristic fallback) behind a requirements approval gate.
# Phase 4 wires development to the Development Agent (headless Claude Code;
# noop in tests/unconfigured environments). Phase 5 wires the reviews stage to
# four real review agents. Phase 6 wires the quality gate to the deterministic
# Quality Gate Agent with a rework edge back to development (§49, bounded by
# max_rework). Phase 7 wires merge (real MergeAgent: waits for green checks,
# merges behind human approval), a static production approval gate, the
# Deployment Agent (GitHub Actions dispatch; a smoke-test failure reworks back
# to deployment, which rolls back to the previous known-good ref, bounded by
# max_rework), and the Verification Agent (smoke tests).

name: software-delivery
description: Requirements -> approval -> development -> parallel review -> gate (rework loop) -> approval -> merge -> production approval -> deploy (rollback loop) -> verify

stages:
  - id: requirements
    agent: requirements-agent

  - id: requirements-approval
    type: approval
    depends_on: [requirements]

  - id: development
    agent: development-agent
    max_attempts: 2
    timeout_ms: 3600000
    depends_on: [requirements-approval]

  - id: reviews
    type: parallel
    parallel:
      - code-review-agent
      - security-review-agent
      - architecture-review-agent
      - test-review-agent
    depends_on: [development]

  - id: quality-gate
    agent: quality-gate-agent
    rework_to: development
    max_rework: 2
    depends_on: [reviews]

  - id: human-approval
    type: approval
    depends_on: [quality-gate]

  - id: merge
    agent: merge-agent
    # development is a direct dep so the PR the Development Agent created
    # (metadata.prUrl) is visible to the merge stage.
    depends_on: [human-approval, development]
    max_attempts: 3
    timeout_ms: 1800000

  - id: production-approval
    # Static production approval gate (Phase 7); the DeploymentAgent's
    # environment policy mirrors it in metadata.
    type: approval
    depends_on: [merge]

  - id: deployment
    agent: deployment-agent
    depends_on: [production-approval]
    input:
      environment: production
      workflow_file: deploy.yml
    max_attempts: 2
    timeout_ms: 1800000

  - id: verification
    agent: verification-agent
    depends_on: [deployment]
    # Smoke-test failure -> rework -> rollback deploy of the previous
    # known-good ref (captured by the MergeAgent). One rollback; exhausted
    # budget fails the run for human investigation.
    rework_to: deployment
    max_rework: 1
    timeout_ms: 300000
